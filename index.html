    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://assets.calendly.com" crossorigin />
    <link rel="dns-prefetch" href="https://assets.calendly.com" />

    <!--
      Resolve the theme before first paint, so the page never flashes the wrong
      ground. Mirrors resolveInitialTheme() in src/hooks/useTheme.js — keep the
      two in step. Light is the default and carries no attribute.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ybz-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark")
            document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#121417" : "#F4F3EF");
        } catch (e) {
          /* private mode or storage disabled — light is the default anyway */
        }
      })();
    </script>

  <body>

    <script
      src="https://assets.calendly.com/assets/external/widget.js"
      async
    ></script>
